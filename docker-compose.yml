# Environment variables are loaded from .env (git-ignored, not in Docker images).
# Copy .env.example to .env and set your values.

services:
  openclaw-gateway:
    platform: linux/amd64
    # Tag override: set a project/environment-level Lagoon variable (build scope)
    # OPENCLAW_BASE_TAG to pin a project to a specific base image version.
    image: ghcr.io/amazeeio/openclaw-lagoon-base:${OPENCLAW_BASE_TAG:-v2026.7.2-beta.7_5}
    user: "10000"
    environment:
      - AMAZEEAI_BASE_URL=${AMAZEEAI_BASE_URL:-https://llm.us103.amazee.ai}
      - AMAZEEAI_API_KEY=${AMAZEEAI_API_KEY}
      - AMAZEEAI_DEFAULT_MODEL=${AMAZEEAI_DEFAULT_MODEL:-chat}
    volumes:
      - ./.local:/home/.openclaw
    ports:
      - "3001:3000"
    labels:
      lagoon.type: basic-single
      lagoon.persistent: /home/.openclaw
      # Volume size override: set a project/environment-level Lagoon variable
      # (build scope) OPENCLAW_VOLUME_SIZE to give one project a larger volume.
      # The default matches the basic-single service-type default, so projects
      # without the variable keep the volume they already have. Growing an
      # existing volume needs allowVolumeExpansion on its StorageClass, and
      # Kubernetes never allows shrinking one back.
      lagoon.persistent.size: ${OPENCLAW_VOLUME_SIZE:-5Gi}
